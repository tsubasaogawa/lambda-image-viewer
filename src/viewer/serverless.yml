service: lambda-image-viewer

provider:
  name: aws
  runtime: provided.al2
  memorySize: 256
  versionFunctions: false

  region: ${env:REGION}

  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "s3:HeadObject*"
        - "s3:GetObject*"
        - "s3:PutObject*"
        - "s3:ListObjects"
      Resource: "arn:aws:s3:::${env:ORIGIN_DOMAIN}/*"
    - Effect: "Allow"
      Action:
        - "s3:ListBucket"
      Resource: "arn:aws:s3:::${env:ORIGIN_DOMAIN}"
    - Effect: "Allow"
      Action:
        - "dynamodb:GetItem"
        - "dynamodb:BatchGetItem"
        - "dynamodb:Scan"
        - "dynamodb:Query"
        - "dynamodb:ConditionCheckItem"
        - "dynamodb:BatchGetItem"
        - "dynamodb:BatchWriteItem"
        - "dynamodb:PutItem"
        - "dynamodb:DescribeTable"
        - "dynamodb:DeleteItem"
        - "dynamodb:UpdateItem"
      Resource: "*"
    - Effect: "Allow"
      Action:
        - "lambda:InvokeFunction"
      Resource: "arn:aws:lambda:${env:REGION}:${aws:accountId}:function:${self:service}-*"

package:
  individually: true

plugins:
  - serverless-better-credentials
  - serverless-go-plugin
  - serverless-prune-plugin

custom:
  go:
    cmd: GOARCH=amd64 GOOS=linux go build -tags lambda.norpc
    supportedRuntimes: ["provided.al2"]
    buildProvidedRuntimeAsBootstrap: true
  prune:
    automatic: true
    number: 3
  origin:
    eventTriggerPrefix: "blog/" # TODO: to envvar

functions:
  viewer:
    handler: cmd/viewer/*.go
    url:
      authorizer: aws_iam
    role:
      Fn::GetAtt: [ViewerExecutionRole, Arn]
    environment:
      REGION: ${env:REGION}
      ORIGIN_DOMAIN: ${env:ORIGIN_DOMAIN}
      VIEWER_DOMAIN: ${env:VIEWER_DOMAIN}
      TABLE: "${env:ORIGIN_DOMAIN}-item"
      PRIVATE_SIGNING_KEY_SECRET_ARN: ${env:PRIVATE_SIGNING_KEY_SECRET_ARN}
      CLOUDFRONT_SIGNING_KEY_ID: ${env:CLOUDFRONT_SIGNING_KEY_ID}

  tagger:
    handler: cmd/tagger/*.go
    url: false
    memorySize: 256
    timeout: 900
    environment:
      REGION: ${env:REGION}
      ORIGIN_DOMAIN: ${env:ORIGIN_DOMAIN}
      TABLE: "${env:ORIGIN_DOMAIN}-item"
      THUMBNAIL_FUNCTION_NAME: "lambda-image-viewer-${sls:stage}-thumbnail"
    events:
      - s3:
          bucket: ${env:ORIGIN_DOMAIN}
          event: "s3:ObjectCreated:*"
          rules:
            - prefix: ${self:custom.origin.eventTriggerPrefix}
            - suffix: .jpg
          existing: true
      - s3:
          bucket: ${env:ORIGIN_DOMAIN}
          event: "s3:ObjectCreated:*"
          rules:
            - prefix: "private/"
            - suffix: .jpg
          existing: true

  thumbnail:
    handler: cmd/thumbnail/*.go
    url: false
    environment:
      REGION: ${env:REGION}
      TABLE: "${env:ORIGIN_DOMAIN}-item"

  cleanup:
    handler: cmd/cleanup/*.go
    url: false
    memorySize: 128
    timeout: 900
    environment:
      REGION: ${env:REGION}
      TABLE: "${env:ORIGIN_DOMAIN}-item"
      S3_BUCKET_NAME: ${env:ORIGIN_DOMAIN}
    events:
      - schedule:
          name: cleanup-schedule
          description: Run cleanup function weekly
          enabled: true
          rate: "cron(0 0 ? * SUN *)"

useDotenv: true

resources:
  Resources:
    ViewerExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: viewer-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:Query
                  Resource:
                    - "arn:aws:dynamodb:${env:REGION}:${aws:accountId}:table/${env:ORIGIN_DOMAIN}-item"
                    - "arn:aws:dynamodb:${env:REGION}:${aws:accountId}:table/${env:ORIGIN_DOMAIN}-item/index/*"
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: ${env:PRIVATE_SIGNING_KEY_SECRET_ARN}
